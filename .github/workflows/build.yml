name: build

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: Manifest URL to bake into the build
        required: false
        default: https://launcher.projectlifezoid.com/release/manifest.json
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
            args: ""
          - os: macos-14
            name: macos
            bundles: dmg,app
            args: --target universal-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: src-tauri
        env:
          PLZ_MANIFEST_URL_BAKED: ${{ inputs.manifest_url || 'https://launcher.projectlifezoid.com/release/manifest.json' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - name: Verify the updater signature exists
        shell: bash
        run: |
          found=$(find src-tauri/target -name '*.sig' -newermt '-2 hours' | head -5)
          if [ -z "$found" ]; then
            echo "::error::No updater signature was produced. Is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi
          echo "signed artifacts:"; echo "$found"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launcher-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.sig
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
