name: build

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: Manifest URL to bake into the build
        required: false
        default: https://launcher.projectlifezoid.com/release/manifest.json
  push:
    tags: ["v*"]

# write, not read: the bundles are attached to a draft RELEASE rather than uploaded as Actions
# artifacts. Artifact storage is a per-account quota that silently killed two releases (0.5.5 and
# the first 0.5.6 run) - both builds succeeded and only the upload failed, and deleting artifacts
# does not restore the quota for 6-12 hours because the usage figure is cached. Release assets do
# not count against it.
permissions:
  contents: write

jobs:
  # Created once, up front. Both build jobs run in parallel and would otherwise race to create
  # the same release, and the loser fails.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - id: draft
        name: Open the draft release the bundles attach to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; the bundles will replace its assets"
          else
            # A DRAFT deliberately: a draft does not create the git tag, so this cannot fire the
            # push:tags trigger above and start the workflow again.
            gh release create "$tag" --draft --title "$tag" \
              --notes "Launcher $version. Build output; the published installers are served from the origin."
          fi

  build:
    needs: prepare
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
            args: ""
          - os: macos-14
            name: macos
            bundles: dmg,app
            args: --target universal-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: src-tauri
        env:
          PLZ_MANIFEST_URL_BAKED: ${{ inputs.manifest_url || 'https://launcher.projectlifezoid.com/release/manifest.json' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - name: Verify the updater signature exists
        shell: bash
        run: |
          found=$(find src-tauri/target -name '*.sig' -newermt '-2 hours' | head -5)
          if [ -z "$found" ]; then
            echo "::error::No updater signature was produced. Is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi
          echo "signed artifacts:"; echo "$found"

      - name: Attach the bundles to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No mapfile: the macOS runner's /bin/bash is 3.2. Null-delimited because every bundle
          # name contains a space.
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(
            find src-tauri/target -path '*release/bundle/*' \
              \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
                 -o -name '*.sig' -o -name '*.app.tar.gz' \) -print0
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::the build produced no bundles to attach"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          gh release upload "${{ needs.prepare.outputs.tag }}" --clobber "${files[@]}"
