[package]
name = "plz-launcher"
version = "0.5.0"
description = "ProjectLifeZoid Launcher"
authors = ["AlexVDefi"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "plz-launcher"
path = "src/main.rs"

[[bin]]
name = "plzctl"
path = "src/bin/plzctl.rs"
required-features = ["cli"]

[features]
cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "net", "rt", "macros"] }
dirs = "5"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2"
sha2 = "0.10"
tauri-plugin-updater = "2"
